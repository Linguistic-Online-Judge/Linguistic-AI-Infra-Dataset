[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistic-online-judge"
version = "0.1.0"
description = "Deterministic evaluation core for the Linguistic Online Judge"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141,<0.142",
    "pydantic>=2.10,<3",
    "redis>=6.4,<7",
    "starlette>=1.6,<1.7",
]

[project.optional-dependencies]
api = [
    "uvicorn>=0.34,<1",
]
qwen-worker = [
    "transformers>=4.57,<5",
]
dev = [
    "httpx2>=2.12,<2.13",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
